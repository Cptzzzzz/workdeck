name: 代码检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: 配置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装终端测试依赖
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: 检查发布内容
        run: python3 scripts/check-publication.py --history
      - name: Go 格式、测试与静态检查
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
      - name: Shell 语法检查
        run: for script in scripts/*.sh; do sh -n "$script"; done
      - name: 前端构建
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: 前端逻辑与终端渲染回归
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test transport-policy.spec.ts network-metrics.spec.ts terminal-dom-rendering.spec.ts
      - name: 检查第三方许可清单
        run: |
          python3 scripts/update-notices.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.md third_party/
      - name: 验证独立部署构建与重启
        run: |
          scripts/install-hub.sh --local --port 18890 --dir "$RUNNER_TEMP/workdeck-smoke" --project workdeck-ci --source "$PWD"
          cd "$RUNNER_TEMP/workdeck-smoke"
          curl -fsS http://127.0.0.1:18890/healthz
          docker compose restart hub
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18890/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
